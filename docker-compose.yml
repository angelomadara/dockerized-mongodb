version: '3.8'

services:
  mongodb:
    build: .
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=VaultTecSecurePass123
    command: ["mongod"]

volumes:
  mongo_data:
    driver: local
